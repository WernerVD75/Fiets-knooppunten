<!DOCTYPE html> 
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fietsknooppunten GPX Maker</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    
    #controls {
      padding: 12px 16px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      z-index: 1000;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label { font-size: 14px; font-weight: 600; color: #333; }

    input[type="text"] {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      width: 180px;
    }

    button {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-primary { background-color: #007bff; color: white; }
    .btn-primary:hover { background-color: #0056b3; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-secondary:hover { background-color: #545b62; }
    .btn-danger { background-color: #dc3545; color: white; }
    .btn-danger:hover { background-color: #bd2130; }

    #info { font-size: 14px; color: #495057; margin-left: auto; font-weight: bold; }
    #status { font-size: 13px; color: #007bff; width: 100%; margin-top: -4px; }
    #map { flex: 1; width: 100%; }
  </style>
</head>
<body>

  <div id="controls">
    <div class="input-group">
      <label for="routeName">Routenaam:</label>
      <input type="text" id="routeName" value="Knooppunten_Route">
    </div>
    
    <button class="btn-primary" onclick="downloadGPX()">Sla op als GPX voor Bosch</button>
    <button class="btn-secondary" onclick="undoLast()">Laatste punt wissen</button>
    <button class="btn-danger" onclick="clearAll()">Alles wissen</button>
    <span id="info">Knooppunten: 0 | Afstand: 0 km</span>
    <div id="status">Zoom in op het gebied en klik op een knooppunt...</div>
  </div>

  <div id="map"></div>

  <script>
    // Start op Beerse / Kempen
    const map = L.map('map').setView([51.318, 4.858], 13);

    // CyclOSM Fietskaart
    L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: 'CyclOSM | OpenStreetMap'
    }).addTo(map);

    let waypoints = [];       
    let routeSegments = [];   
    let markers = [];         
    let polylineGroup = L.featureGroup().addTo(map); 

    map.on('click', async function(e) {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      document.getElementById('status').innerText = 'Dichtstbijzijnde fietsknooppunt zoeken...';

      // Zoek het dichtstbijzijnde officiële knooppunt via Overpass API
      const snappedPoint = await findNearestKnooppunt(lat, lng);

      if (!snappedPoint) {
        document.getElementById('status').innerText = 'Geen knooppunt gevonden dichtbij de geklikte plek. Zoom in en klik dichter bij een nummer.';
        return;
      }

      const pointIndex = waypoints.length + 1;
      const nodeName = snappedPoint.ref ? `Knooppunt ${snappedPoint.ref}` : `Knooppunt ${pointIndex}`;
      
      waypoints.push({
        lat: snappedPoint.lat,
        lng: snappedPoint.lng,
        ref: snappedPoint.ref || pointIndex
      });

      // Maak een duidelijke knooppunt-marker op de gekozen plek
      const marker = L.circleMarker([snappedPoint.lat, snappedPoint.lng], {
        radius: 11,
        fillColor: '#28a745',
        color: '#ffffff',
        weight: 3,
        opacity: 1,
        fillOpacity: 1
      }).addTo(map);

      marker.bindTooltip(nodeName, { permanent: true, direction: 'top', offset: [0, -10] });
      markers.push(marker);

      if (waypoints.length > 1) {
        document.getElementById('status').innerText = 'Fietsroute over knooppuntennetwerk berekenen...';
        const start = waypoints[waypoints.length - 2];
        const end = waypoints[waypoints.length - 1];
        
        const segmentCoords = await fetchBikeRoute([start.lat, start.lng], [end.lat, end.lng]);
        routeSegments.push(segmentCoords);
      }

      updateMap();
    });

    // Zoek het dichtstbijzijnde knooppunt (binnen straal van ~800m van waar gedrukt wordt)
    async function findNearestKnooppunt(lat, lng) {
      const query = `[out:json];node(around:800,${lat},${lng})["rcn_ref"];out;`;
      const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.elements && data.elements.length > 0) {
          let closest = null;
          let minDistance = Infinity;

          data.elements.forEach(el => {
            const dist = L.latLng(lat, lng).distanceTo(L.latLng(el.lat, el.lon));
            if (dist < minDistance) {
              minDistance = dist;
              closest = { lat: el.lat, lng: el.lon, ref: el.tags.rcn_ref };
            }
          });
          return closest;
        }
      } catch (err) {
        console.error("Fout bij ophalen knooppunt:", err);
      }

      // Als er niks wordt gevonden in de buurt, negeer de klik
      return null;
    }

    // Gebruik de specifieke fietspad-routering van CyclOSM/OpenStreetMap
    async function fetchBikeRoute(start, end) {
      const url = `https://routing.openstreetmap.de/routed-bike/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;
      
      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          return data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
        }
      } catch (err) {
        console.error("Routing fout:", err);
      }
      
      return [start, end];
    }

    function updateMap() {
      polylineGroup.clearLayers();
      let totalDistanceMeters = 0;

      routeSegments.forEach(segment => {
        const line = L.polyline(segment, { color: '#0056b3', weight: 6, opacity: 0.85 });
        polylineGroup.addLayer(line);
      });

      const fullPath = getFullTrackPoints();
      for (let i = 0; i < fullPath.length - 1; i++) {
        totalDistanceMeters += L.latLng(fullPath[i]).distanceTo(L.latLng(fullPath[i + 1]));
      }

      const distanceKm = (totalDistanceMeters / 1000).toFixed(1);
      const lastWp = waypoints[waypoints.length - 1];
      const statusText = waypoints.length === 0 
        ? 'Klik in de buurt van een knooppunt...' 
        : `Laatste knooppunt: ${lastWp.ref}. Klik op het volgende knooppunt...`;

      document.getElementById('info').innerText = `Knooppunten: ${waypoints.length} | Afstand: ${distanceKm} km`;
      document.getElementById('status').innerText = statusText;
    }

    function getFullTrackPoints() {
      if (waypoints.length === 0) return [];
      if (waypoints.length === 1) return [[waypoints[0].lat, waypoints[0].lng]];

      let fullPath = [];
      routeSegments.forEach((segment, index) => {
        if (index === 0) {
          fullPath = fullPath.concat(segment);
        } else {
          fullPath = fullPath.concat(segment.slice(1));
        }
      });
      return fullPath;
    }

    function undoLast() {
      if (waypoints.length === 0) return;
      waypoints.pop();
      const lastMarker = markers.pop();
      map.removeLayer(lastMarker);

      if (routeSegments.length > 0) {
        routeSegments.pop();
      }
      updateMap();
    }

    function clearAll() {
      waypoints = [];
      routeSegments = [];
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      updateMap();
    }

    function downloadGPX() {
      const fullTrack = getFullTrackPoints();

      if (fullTrack.length === 0) {
        alert("Klik eerst een paar knooppunten aan op de kaart.");
        return;
      }

      let rawName = document.getElementById('routeName').value.trim() || "Knooppunten_Route";
      const timestamp = new Date().toISOString();

      let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n`;
      gpx += `<gpx version="1.1" creator="Fietsknooppunten GPX Maker" xmlns="http://www.topografix.com/GPX/1/1">\n`;
      gpx += `  <metadata>\n    <name>${escapeXml(rawName)}</name>\n    <time>${timestamp}</time>\n  </metadata>\n`;
      
      waypoints.forEach((wp) => {
        gpx += `  <wpt lat="${wp.lat}" lon="${wp.lng}">\n    <name>Knooppunt ${wp.ref}</name>\n  </wpt>\n`;
      });

      gpx += `  <trk>\n    <name>${escapeXml(rawName)}</name>\n    <trkseg>\n`;

      fullTrack.forEach(pt => {
        gpx += `      <trkpt lat="${pt[0]}" lon="${pt[1]}"></trkpt>\n`;
      });

      gpx += `    </trkseg>\n  </trk>\n</gpx>`;

      const fileName = rawName.toLowerCase().replace(/[^a-z0-9_]/gi, '_') + '.gpx';

      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function escapeXml(unsafe) {
      return unsafe.replace(/[<>&'"]/g, function (c) {
        switch (c) {
          case '<': return '&lt;';
          case '>': return '&gt;';
          case '&': return '&amp;';
          case '\'': return '&apos;';
          case '"': return '&quot;';
        }
      });
    }

// AUTOMATISCHE OFFLINE BEWAREN
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE = 'wf-cache-v1';
                    self.addEventListener('install', e => {
                        e.waitUntil(caches.open(CACHE).then(c => c.add(location.href)));
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', e => self.clients.claim());
                    self.addEventListener('fetch', e => {
                        e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            });
        }
  </script>
</body>
</html>
