<!DOCTYPE html> 
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fietsknooppunten GPX Maker voor Bosch</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- PapaParse voor het razendsnel inlezen van knooppunten -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    
    #controls {
      padding: 12px 16px;
      background-color: #f8f9fa;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      z-index: 1000;
    }

    .input-group { display: flex; align-items: center; gap: 6px; }
    label { font-size: 14px; font-weight: 600; color: #333; }

    input[type="text"] {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      width: 180px;
    }

    button {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-primary { background-color: #007bff; color: white; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-danger { background-color: #dc3545; color: white; }

    #info { font-size: 14px; color: #495057; margin-left: auto; font-weight: bold; }
    #status { font-size: 13px; color: #d9534f; width: 100%; margin-top: -4px; font-weight: 600; }
    #status.ok { color: #28a745; }
    #map { flex: 1; width: 100%; }
    
    .knooppunt-badge {
      background-color: #007bff;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      text-align: center;
      font-weight: bold;
      font-size: 12px;
      line-height: 24px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div id="controls">
    <div class="input-group">
      <label for="routeName">Routenaam:</label>
      <input type="text" id="routeName" value="Knooppunten_Route">
    </div>
    
    <button class="btn-primary" onclick="downloadGPX()">Sla op als GPX voor Bosch</button>
    <button class="btn-secondary" onclick="undoLast()">Laatste punt wissen</button>
    <button class="btn-danger" onclick="clearAll()">Alles wissen</button>
    <span id="info">Knooppunten: 0 | Afstand: 0 km</span>
    <div id="status">Knooppuntenbestand laden...</div>
  </div>

  <div id="map"></div>

  <script>
    const map = L.map('map').setView([51.318, 4.858], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Knooppuntennetwerk overlay
    L.tileLayer('https://tile.waymarkedtrails.org/cycling/{z}/{x}/{y}.png', {
      maxZoom: 19,
      opacity: 0.85,
      attribution: '© Waymarked Trails'
    }).addTo(map);

    let allNodes = [];
    let waypoints = [];       
    let routeSegments = [];   
    let markers = [];         
    let polylineGroup = L.featureGroup().addTo(map);

    const fileCandidates = [
      "knooppunten.txt",
      "knooppunten.csv",
      "knooppunten.txt.txt",
      "knooppunten.csv.txt",
      "https://raw.githubusercontent.com/wernervd75/Fiets-knooppunten/main/knooppunten.txt",
      "https://raw.githubusercontent.com/wernervd75/Fiets-knooppunten/main/knooppunten.csv"
    ];

    function tryNextFile(index) {
      if (index >= fileCandidates.length) {
        document.getElementById('status').innerText = '❌ Kon knooppuntenbestand niet laden op GitHub. Controleer of het bestand in de hoofdmap staat.';
        return;
      }

      Papa.parse(fileCandidates[index], {
        download: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            allNodes = results.data.map(row => ({
              lon: parseFloat(row[0]),
              lat: parseFloat(row[1]),
              ref: row[2] ? row[2].toString().trim() : '',
              region: row[3] ? row[3].trim() : ''
            })).filter(n => !isNaN(n.lat) && !isNaN(n.lon));

            if (allNodes.length > 0) {
              const statusEl = document.getElementById('status');
              statusEl.innerText = `✔ ${allNodes.length.toLocaleString()} knooppunten geladen. Klik op een knooppunt op de kaart...`;
              statusEl.classList.add('ok');
              return;
            }
          }
          tryNextFile(index + 1);
        },
        error: function() {
          tryNextFile(index + 1);
        }
      });
    }

    tryNextFile(0);

    map.on('click', async function(e) {
      if (allNodes.length === 0) {
        alert("Knooppunten zijn nog bezig met laden...");
        return;
      }

      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      const node = findClosestNode(lat, lng);

      if (!node) {
        document.getElementById('status').innerText = '❌ Geen knooppunt dichtbij gevonden.';
        return;
      }

      if (waypoints.length > 0 && waypoints[waypoints.length - 1].ref === node.ref && 
          waypoints[waypoints.length - 1].lat === node.lat) {
        return;
      }

      waypoints.push(node);

      const customIcon = L.divIcon({
        className: 'knooppunt-badge',
        html: node.ref,
        iconSize: [26, 26],
        iconAnchor: [13, 13]
      });

      const marker = L.marker([node.lat, node.lon], { icon: customIcon }).addTo(map);
      markers.push(marker);

      if (waypoints.length > 1) {
        const statusEl = document.getElementById('status');
        statusEl.innerText = `Fietsnetwerk berekenen naar knooppunt ${node.ref}...`;
        statusEl.classList.add('ok');

        const start = waypoints[waypoints.length - 2];
        const end = waypoints[waypoints.length - 1];
        
        const segmentCoords = await fetchCyclingRoute(start, end);
        routeSegments.push(segmentCoords);
      }

      updateMap();
    });

    function findClosestNode(lat, lng) {
      let closest = null;
      let minDistance = Infinity;

      for (let i = 0; i < allNodes.length; i++) {
        const node = allNodes[i];
        const dist = L.latLng(lat, lng).distanceTo(L.latLng(node.lat, node.lon));
        if (dist < minDistance) {
          minDistance = dist;
          closest = node;
        }
      }

      return minDistance < 400 ? closest : null;
    }

    // AANGEPAST: Gebruikt BRouter speciaal afgesteld op het FIETSNETWERK (safety profile)
    async function fetchCyclingRoute(startNode, endNode) {
      // BRouter fietsnetwerk profiel
      const brouterUrl = `https://brouter.de/brouter?lonlats=${startNode.lon},${startNode.lat}|${endNode.lon},${endNode.lat}&profile=safety&format=geojson`;

      try {
        const response = await fetch(brouterUrl);
        const data = await response.json();

        if (data.features && data.features.length > 0) {
          const coords = data.features[0].geometry.coordinates;
          // BRouter geeft [lon, lat, elev] -> omzetten naar Leaflet [lat, lon]
          return coords.map(c => [c[1], c[0]]);
        }
      } catch (err) {
        console.warn("BRouter traag, schakelt over naar OSRM fallback:", err);
      }

      // Secondary Fallback: OSRM
      const osrmUrl = `https://router.project-osrm.org/route/v1/bike/${startNode.lon},${startNode.lat};${endNode.lon},${endNode.lat}?overview=full&geometries=geojson`;
      try {
        const response = await fetch(osrmUrl);
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          return data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
        }
      } catch (err) {
        console.error("Routing mislukt:", err);
      }

      return [[startNode.lat, startNode.lon], [endNode.lat, endNode.lon]];
    }

    function updateMap() {
      polylineGroup.clearLayers();
      let totalDistanceMeters = 0;

      routeSegments.forEach(segment => {
        const line = L.polyline(segment, { color: '#0056b3', weight: 6, opacity: 0.85 });
        polylineGroup.addLayer(line);
      });

      const fullPath = getFullTrackPoints();
      for (let i = 0; i < fullPath.length - 1; i++) {
        totalDistanceMeters += L.latLng(fullPath[i]).distanceTo(L.latLng(fullPath[i + 1]));
      }

      const distanceKm = (totalDistanceMeters / 1000).toFixed(1);
      const lastWp = waypoints[waypoints.length - 1];
      
      document.getElementById('info').innerText = `Knooppunten: ${waypoints.length} | Afstand: ${distanceKm} km`;
      if (waypoints.length > 0) {
        document.getElementById('status').innerText = `✔ Knooppunt ${lastWp.ref} toegevoegd.`;
      }
    }

    function getFullTrackPoints() {
      if (waypoints.length === 0) return [];
      if (waypoints.length === 1) return [[waypoints[0].lat, waypoints[0].lon]];

      let fullPath = [];
      routeSegments.forEach((segment, index) => {
        if (index === 0) {
          fullPath = fullPath.concat(segment);
        } else {
          fullPath = fullPath.concat(segment.slice(1));
        }
      });
      return fullPath;
    }

    function undoLast() {
      if (waypoints.length === 0) return;
      waypoints.pop();
      const lastMarker = markers.pop();
      map.removeLayer(lastMarker);
      if (routeSegments.length > 0) routeSegments.pop();
      updateMap();
    }

    function clearAll() {
      waypoints = [];
      routeSegments = [];
      markers.forEach(m => map.removeLayer(m));
      markers = [];
      updateMap();
    }

    function downloadGPX() {
      const fullTrack = getFullTrackPoints();

      if (fullTrack.length === 0) {
        alert("Klik eerst op een aantal knooppunten op de kaart.");
        return;
      }

      let rawName = document.getElementById('routeName').value.trim() || "Knooppunten_Route";
      const timestamp = new Date().toISOString();

      let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n`;
      gpx += `<gpx version="1.1" creator="Fietsknooppunten GPX Maker" xmlns="http://www.topografix.com/GPX/1/1">\n`;
      gpx += `  <metadata>\n    <name>${escapeXml(rawName)}</name>\n    <time>${timestamp}</time>\n  </metadata>\n`;
      
      waypoints.forEach((wp) => {
        gpx += `  <wpt lat="${wp.lat}" lon="${wp.lon}">\n    <name>KP ${wp.ref}</name>\n  </wpt>\n`;
      });

      gpx += `  <rte>\n    <name>${escapeXml(rawName)}</name>\n`;
      fullTrack.forEach((pt, idx) => {
        if (idx === 0 || idx === fullTrack.length - 1 || idx % 4 === 0) {
          gpx += `    <rtept lat="${pt[0]}" lon="${pt[1]}"></rtept>\n`;
        }
      });
      gpx += `  </rte>\n`;

      gpx += `  <trk>\n    <name>${escapeXml(rawName)}</name>\n    <trkseg>\n`;
      fullTrack.forEach(pt => {
        gpx += `      <trkpt lat="${pt[0]}" lon="${pt[1]}"></trkpt>\n`;
      });
      gpx += `    </trkseg>\n  </trk>\n</gpx>`;

      const fileName = rawName.toLowerCase().replace(/[^a-z0-9_]/gi, '_') + '.gpx';

      const blob = new Blob([gpx], { type: 'application/gpx+xml' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function escapeXml(unsafe) {
      return unsafe.replace(/[<>&'"]/g, function (c) {
        switch (c) {
          case '<': return '&lt;';
          case '>': return '&gt;';
          case '&': return '&amp;';
          case '\'': return '&apos;';
          case '"': return '&quot;';
        }
      });
    }

// AUTOMATISCHE OFFLINE BEWAREN
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE = 'wf-cache-v1';
                    self.addEventListener('install', e => {
                        e.waitUntil(caches.open(CACHE).then(c => c.add(location.href)));
                        self.skipWaiting();
                    });
                    self.addEventListener('activate', e => self.clients.claim());
                    self.addEventListener('fetch', e => {
                        e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl).catch(() => {});
            });
        }
  </script>
</body>
</html>
